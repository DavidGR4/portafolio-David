<section id="contact" class="py-5 bg-light">
  <div class="container px-4">
    <div class="section-title mb-4">
      <h2 class="fw-bold text-dark position-relative pb-2">Contacto</h2>
      <p class="text-muted">¿Tienes alguna consulta o propuesta de proyecto? Ponte en contacto conmigo.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="bg-white p-4 rounded shadow-sm">
          <div class="d-flex mb-3 align-items-center">
            <i class="bi bi-geo-alt fs-3 text-primary me-3"></i>
            <div>
              <h6 class="fw-bold mb-0">Ubicación:</h6>
              <span class="text-muted small">Cochabamba, Bolivia</span>
            </div>
          </div>

          <div class="d-flex mb-3 align-items-center">
            <i class="bi bi-envelope fs-3 text-primary me-3"></i>
            <div>
              <h6 class="fw-bold mb-0">Email:</h6>
              <span class="text-muted small">tuemail&#64;ejemplo.com</span>
            </div>
          </div>

          <div class="d-flex align-items-center">
            <i class="bi bi-phone fs-3 text-primary me-3"></i>
            <div>
              <h6 class="fw-bold mb-0">Teléfono:</h6>
              <span class="text-muted small">+591 123 456 789</span>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <form class="bg-white p-4 rounded shadow-sm">
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="Tu Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control" placeholder="Tu Email" required>
            </div>
            <div class="col-12">
              <input type="text" class="form-control" placeholder="Asunto" required>
            </div>
            <div class="col-12">
              <textarea class="form-control" rows="4" placeholder="Mensaje" required></textarea>
            </div>
            <div class="col-12 text-center">
              <button type="button" class="btn btn-primary px-4 py-2">Enviar Mensaje</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
